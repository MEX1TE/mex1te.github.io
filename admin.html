<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | CS2NADES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container{max-width:1400px;margin:0 auto;padding:2rem}
        .admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;gap:1rem}
        .admin-title{font-size:2rem;font-weight:700}
        .admin-actions{display:flex;gap:1rem;flex-wrap:wrap}
        .btn-admin{padding:.7rem 1.5rem;border-radius:var(--radius-sm);font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all var(--transition);display:flex;align-items:center;gap:.5rem}
        .btn-save{background:var(--he);color:#fff}
        .btn-save:hover{background:#2ea043;transform:translateY(-2px)}
        .btn-clear{background:var(--molotov);color:#fff}
        .btn-clear:hover{background:#da3633;transform:translateY(-2px)}
        .btn-add{background:var(--smoke);color:#fff}
        .btn-add:hover{background:#4a9eff;transform:translateY(-2px)}
        .btn-logout{background:var(--bg-card);color:var(--text-2);border:1px solid var(--border)}
        .btn-logout:hover{background:var(--molotov);color:#fff;border-color:var(--molotov)}
        
        .map-selector{margin-bottom:1.5rem}
        .map-selector label{display:block;margin-bottom:.5rem;font-weight:600;color:var(--text-2)}
        .map-selector select{width:100%;max-width:300px;padding:.7rem;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-1);font-family:inherit;font-size:.95rem;cursor:pointer}
        
        .admin-layout{display:grid;grid-template-columns:1fr 450px;gap:2rem}
        @media(max-width:1024px){.admin-layout{grid-template-columns:1fr}}
        
        .admin-map-wrapper{position:relative;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:crosshair}
        .admin-map-image{width:100%;height:auto;display:block;pointer-events:none}
        
        .admin-hotspot-target{position:absolute;width:32px;height:32px;transform:translate(-50%,-50%);cursor:pointer;transition:all var(--transition);z-index:10}
        .admin-hotspot-target::before{content:'';position:absolute;inset:0;border-radius:50%;background:var(--accent);opacity:.4;animation:pulse 2s ease-in-out infinite}
        .admin-hotspot-target::after{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
        .admin-hotspot-target:hover{transform:translate(-50%,-50%) scale(1.2)}
        .admin-hotspot-target.selected{transform:translate(-50%,-50%) scale(1.3);z-index:20}
        .admin-hotspot-target.selected::before{background:var(--he);opacity:.6}
        .admin-hotspot-target.selected::after{background:var(--he)}
        .admin-hotspot-target-label{position:absolute;top:36px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);color:var(--text-1);padding:.4rem .8rem;border-radius:var(--radius-sm);font-size:.75rem;font-weight:600;white-space:nowrap;pointer-events:none}
        .admin-hotspot-count{position:absolute;top:-8px;right:-8px;background:var(--molotov);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;border:2px solid var(--bg-secondary)}
        
        .admin-hotspot-source{position:absolute;width:26px;height:26px;transform:translate(-50%,-50%);cursor:pointer;transition:all var(--transition);z-index:15}
        .admin-hotspot-source::before{content:'';position:absolute;inset:0;border-radius:50%;background:var(--smoke);opacity:.5;animation:pulse 2s ease-in-out infinite}
        .admin-hotspot-source::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--smoke);box-shadow:0 0 10px rgba(88,166,255,.5)}
        .admin-hotspot-source:hover{transform:translate(-50%,-50%) scale(1.2)}
        .admin-hotspot-source-label{position:absolute;top:30px;left:50%;transform:translateX(-50%);background:rgba(88,166,255,.9);color:#fff;padding:.3rem .7rem;border-radius:var(--radius-sm);font-size:.7rem;font-weight:600;white-space:nowrap;pointer-events:none}
        
        .connection-line{position:absolute;height:2px;background:linear-gradient(90deg,var(--smoke),var(--accent));transform-origin:0 50%;pointer-events:none;z-index:5;opacity:.5}
        
        .admin-hotspot-preview{position:absolute;width:36px;height:36px;transform:translate(-50%,-50%);z-index:25;pointer-events:none;animation:previewAppear .3s ease}
        .admin-hotspot-preview::before{content:'';position:absolute;inset:0;border-radius:50%;opacity:.5;animation:previewPulse 1.5s ease-in-out infinite}
        .admin-hotspot-preview::after{content:'';position:absolute;inset:6px;border-radius:50%}
        .admin-hotspot-preview.target::before{background:var(--accent)}
        .admin-hotspot-preview.target::after{background:var(--accent);box-shadow:0 0 15px var(--accent-glow)}
        .admin-hotspot-preview.source::before{background:var(--smoke)}
        .admin-hotspot-preview.source::after{background:var(--smoke);box-shadow:0 0 15px rgba(88,166,255,.6)}
        .admin-hotspot-preview-label{position:absolute;top:40px;left:50%;transform:translateX(-50%);padding:.3rem .7rem;border-radius:var(--radius-sm);font-size:.72rem;font-weight:600;white-space:nowrap}
        .admin-hotspot-preview.target .admin-hotspot-preview-label{background:var(--accent);color:#000}
        .admin-hotspot-preview.source .admin-hotspot-preview-label{background:var(--smoke);color:#fff}
        
        @keyframes previewAppear{from{opacity:0;transform:translate(-50%,-50%) scale(0.5)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
        @keyframes previewPulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.6);opacity:.15}}
        
        .admin-form{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;height:fit-content;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto}
        .form-title{font-size:1.2rem;font-weight:700;margin-bottom:1.25rem;display:flex;align-items:center;gap:.5rem}
        .form-group{margin-bottom:1rem}
        .form-group label{display:block;margin-bottom:.4rem;font-weight:600;color:var(--text-2);font-size:.85rem}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:.65rem;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-1);font-family:inherit;font-size:.9rem;transition:all var(--transition)}
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
        .form-group textarea{resize:vertical;min-height:80px;font-family:'JetBrains Mono','Courier New',monospace}
        .form-coords{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem}
        .coord-display{background:var(--bg-tertiary);padding:.6rem;border-radius:var(--radius-sm);font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--accent);text-align:center}
        
        .status-bar{padding:.65rem 1rem;background:var(--bg-tertiary);border-radius:var(--radius-sm);margin-bottom:1rem;display:flex;align-items:center;gap:.6rem;font-size:.85rem}
        .status-dot{width:8px;height:8px;border-radius:50%;background:var(--he);animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        
        .hint-box{padding:.85rem;background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.2);border-radius:var(--radius-sm);margin-bottom:1rem;font-size:.85rem;color:var(--text-2);display:flex;align-items:flex-start;gap:.6rem}
        .hint-box-icon{font-size:1.2rem;flex-shrink:0}
        
        .sources-section{margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid var(--border)}
        .sources-title{font-size:.95rem;font-weight:700;margin-bottom:.75rem;display:flex;align-items:center;justify-content:space-between}
        .source-item{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.85rem;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center}
        .source-item-info{display:flex;align-items:center;gap:.6rem;flex:1;min-width:0}
        .source-item-icon{font-size:1.1rem}
        .source-item-name{font-weight:600;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .source-item-actions{display:flex;gap:.4rem;flex-shrink:0}
        .btn-sm{padding:.35rem .65rem;border-radius:var(--radius-sm);font-size:.75rem;font-weight:600;cursor:pointer;border:none;transition:all var(--transition)}
        .btn-edit{background:var(--accent);color:#000}
        .btn-delete{background:var(--molotov);color:#fff}
        
        .empty-state{text-align:center;padding:2rem;color:var(--text-3);font-size:.85rem}
        
        .btn-cancel{width:100%;padding:.65rem;background:var(--bg-card);color:var(--text-2);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;transition:all var(--transition);margin-top:.5rem}
        .btn-cancel:hover{background:var(--bg-card-hover);color:var(--text-1)}
        
        .targets-list{margin-top:1.5rem;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem}
        .targets-list-title{font-size:1rem;font-weight:700;margin-bottom:.75rem}
        .target-item{display:flex;justify-content:space-between;align-items:center;padding:.65rem;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:.4rem;cursor:pointer;transition:all var(--transition)}
        .target-item:hover{border-color:var(--border-hover)}
        .target-item.selected{border-color:var(--he);background:rgba(63,185,80,.05)}
        .target-item-info{display:flex;align-items:center;gap:.6rem}
        .target-item-icon{font-size:1rem}
        .target-item-name{font-weight:600;font-size:.85rem}
        .target-item-count{font-size:.7rem;color:var(--text-3);margin-left:.4rem}
        .target-item-actions{display:flex;gap:.4rem}
        
        .side-selector{display:flex;gap:.5rem;margin-bottom:1rem}
        .side-selector label{flex:1;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.6rem;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all var(--transition);font-weight:600}
        .side-selector label:hover{background:var(--bg-card-hover)}
        .side-selector input[type="radio"]{accent-color:var(--accent)}
        .side-selector label:has(input:checked){border-color:var(--accent);background:rgba(245,166,35,.1)}
    </style>
</head>

<script>
// Весь функционал админки теперь внутри этой функции и запустится ТОЛЬКО после успешного входа
function initAdminPanel() {
    let currentMap = 'mirage';
    let targets = { mirage: [], dust2: [], inferno: [], ancient: [], anubis: [], nuke: [], overpass: [], vertigo: [] };
    let selectedTargetId = null;
    let editingSourceId = null;
    let currentTargetForSource = null;
    let tempCoords = { x: 0, y: 0 };
    let previewElement = null;
    let mode = 'target';

    db.ref('lineups').on('value', snapshot => {
        const data = snapshot.val() || {};
        targets = {
            mirage: data.mirage || [],
            dust2: data.dust2 || [],
            inferno: data.inferno || [],
            ancient: data.ancient || [],
            anubis: data.anubis || [],
            nuke: data.nuke || [],
            overpass: data.overpass || [],
            vertigo: data.vertigo || []
        };
        renderAll();
    });

    function switchMap() {
        currentMap = document.getElementById('map-select').value;
        document.getElementById('map-image').src = `images/${currentMap}-radar.webp`;
        selectedTargetId = null;
        editingSourceId = null;
        mode = 'target';
        removePreview();
        renderAll();
        updateModeUI();
    }

    function removePreview() {
        if (previewElement) { previewElement.remove(); previewElement = null; }
    }

    function createPreview(x, y, type) {
        removePreview();
        previewElement = document.createElement('div');
        previewElement.className = `admin-hotspot-preview ${type}`;
        previewElement.style.left = x + '%';
        previewElement.style.top = y + '%';
        const label = type === 'target' ? '🎯 Новая цель' : '📍 Новый источник';
        previewElement.innerHTML = `<div class="admin-hotspot-preview-label">${label}</div>`;
        document.getElementById('map-wrapper').appendChild(previewElement);
    }

    function updateModeUI() {
        const hintText = document.getElementById('hint-text');
        if (mode === 'target') {
            hintText.innerHTML = 'Кликните на пустое место карты, чтобы создать <strong>точку-цель</strong> (куда прилетает граната).';
        } else {
            const target = targets[currentMap].find(t => t.id === selectedTargetId);
            hintText.innerHTML = `Кликните на карту, чтобы создать <strong>источник</strong> для цели "<strong>${target ? target.title : '?'}</strong>". <button onclick="exitSourceMode()" style="background:var(--molotov);color:#fff;border:none;padding:.3rem .7rem;border-radius:4px;font-size:.75rem;cursor:pointer;margin-left:.5rem">Выйти</button>`;
        }
    }

    function exitSourceMode() {
        mode = 'target';
        selectedTargetId = null;
        editingSourceId = null;
        removePreview();
        renderAll();
        updateModeUI();
        renderForm();
    }

    document.getElementById('map-wrapper').addEventListener('click', function(event) {
        if (event.target.closest('.admin-hotspot-target') || event.target.closest('.admin-hotspot-source')) return;
        
        const rect = this.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * 100;
        const y = ((event.clientY - rect.top) / rect.height) * 100;
        
        tempCoords = { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 };
        
        if (mode === 'target') {
            createPreview(tempCoords.x, tempCoords.y, 'target');
            showTargetForm();
        } else if (mode === 'source') {
            createPreview(tempCoords.x, tempCoords.y, 'source');
            showSourceForm();
        }
        
        document.getElementById('admin-form').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    function selectTarget(id) {
        selectedTargetId = id;
        mode = 'source';
        editingSourceId = null;
        removePreview();
        renderAll();
        updateModeUI();
        showTargetDetailsForm();
    }

    function showTargetForm() {
        const form = document.getElementById('form-content');
        form.innerHTML = `
            <h3 class="form-title">🎯 Новая точка-цель</h3>
            <div class="form-group">
                <label>Название (куда прилетает):</label>
                <input type="text" id="input-title" placeholder="Например: Окно Mid" autofocus>
            </div>
            <div class="form-coords">
                <div><label>X (%):</label><div class="coord-display" id="coord-x">${tempCoords.x}%</div></div>
                <div><label>Y (%):</label><div class="coord-display" id="coord-y">${tempCoords.y}%</div></div>
            </div>
            <button class="btn-admin btn-save" style="width:100%;justify-content:center" onclick="saveNewTarget()">💾 Создать цель</button>
            <button class="btn-cancel" onclick="cancelAction()">❌ Отмена</button>
        `;
    }

    function showSourceForm() {
        const target = targets[currentMap].find(t => t.id === selectedTargetId);
        if (!target) return;
        
        const form = document.getElementById('form-content');
        form.innerHTML = `
            <h3 class="form-title">📍 Новый источник</h3>
            <p style="color:var(--text-2);font-size:.85rem;margin-bottom:1rem">Для цели: <strong style="color:var(--accent)">${target.title}</strong></p>
            <div class="form-group">
                <label>Название (откуда кидать):</label>
                <input type="text" id="input-source-title" placeholder="Например: T-spawn #1" autofocus>
            </div>
            <div class="form-group">
                <label>Сторона:</label>
                <div class="side-selector">
                    <label><input type="radio" name="source-side" value="T" checked> T-Side</label>
                    <label><input type="radio" name="source-side" value="CT"> CT-Side</label>
                </div>
            </div>
            <div class="form-group">
                <label>Тип гранаты:</label>
                <select id="input-source-type">
                    <option value="smoke">💨 Smoke</option>
                    <option value="flash">⚡ Flash</option>
                    <option value="molotov">🔥 Molotov</option>
                    <option value="he">💥 HE</option>
                </select>
            </div>
            <div class="form-group">
                <label>Прицел:</label>
                <input type="text" id="input-source-aim" placeholder="Например: На раму окна">
            </div>
            <div class="form-group">
                <label>Инструкция:</label>
                <textarea id="input-source-inst" placeholder="1. Встань...&#10;2. Прицел...&#10;3. Jump throw"></textarea>
            </div>
            <div class="form-group">
                <label>Видео:</label>
                <input type="text" id="input-source-video" placeholder="https://youtube.com/watch?v=... или videos/clip.mp4">
            </div>
            <div class="form-coords">
                <div><label>X (%):</label><div class="coord-display">${tempCoords.x}%</div></div>
                <div><label>Y (%):</label><div class="coord-display">${tempCoords.y}%</div></div>
            </div>
            <button class="btn-admin btn-save" style="width:100%;justify-content:center" onclick="saveNewSource()">💾 Создать источник</button>
            <button class="btn-cancel" onclick="cancelAction()">❌ Отмена</button>
        `;
    }

    function showTargetDetailsForm() {
        const target = targets[currentMap].find(t => t.id === selectedTargetId);
        if (!target) return;
        
        const icons = { smoke: '💨', flash: '⚡', molotov: '🔥', he: '💥' };
        const form = document.getElementById('form-content');
        
        let sourcesHTML = '';
        if (target.sources && target.sources.length > 0) {
            sourcesHTML = target.sources.map(s => `
                <div class="source-item">
                    <div class="source-item-info">
                        <span class="source-item-icon">${icons[s.type]}</span>
                        <span class="source-item-name">${s.title} (${s.side})</span>
                    </div>
                    <div class="source-item-actions">
                        <button class="btn-sm btn-edit" onclick="editSource('${s.id}')">✏️</button>
                        <button class="btn-sm btn-delete" onclick="deleteSource('${s.id}')">🗑</button>
                    </div>
                </div>
            `).join('');
        } else {
            sourcesHTML = '<div class="empty-state">Нет источников. Кликните на карту, чтобы добавить.</div>';
        }
        
        form.innerHTML = `
            <h3 class="form-title">🎯 ${target.title}</h3>
            <div class="form-coords">
                <div><label>X:</label><div class="coord-display">${target.x}%</div></div>
                <div><label>Y:</label><div class="coord-display">${target.y}%</div></div>
            </div>
            <button class="btn-admin btn-clear" style="width:100%;justify-content:center;margin-bottom:.5rem" onclick="deleteTarget('${target.id}')">🗑 Удалить цель</button>
            <button class="btn-cancel" onclick="exitSourceMode()">← Назад к целям</button>
            
            <div class="sources-section">
                <div class="sources-title"><span>📍 Источники (${target.sources ? target.sources.length : 0})</span></div>
                ${sourcesHTML}
                <p style="color:var(--text-3);font-size:.8rem;text-align:center;margin-top:.75rem">💡 Кликните на карту, чтобы добавить источник</p>
            </div>
        `;
    }

    function renderForm() {
        if (selectedTargetId && mode === 'source') {
            showTargetDetailsForm();
        } else {
            const form = document.getElementById('form-content');
            form.innerHTML = `
                <h3 class="form-title">🎯 Выберите действие</h3>
                <div class="empty-state">
                    <div style="font-size:2.5rem;margin-bottom:.75rem;opacity:.3">🗺️</div>
                    <p>Кликните на карту, чтобы создать цель,<br>или выберите существующую из списка ниже.</p>
                </div>
            `;
        }
    }

    function saveNewTarget() {
        const title = document.getElementById('input-title').value.trim();
        if (!title) { alert('Введите название!'); return; }
        
        targets[currentMap].push({
            id: `${currentMap}-${Date.now()}`,
            title,
            x: tempCoords.x,
            y: tempCoords.y,
            sources: []
        });
        
        db.ref(`lineups/${currentMap}`).set(targets[currentMap])
            .then(() => {
                removePreview();
                renderAll();
                mode = 'target';
                updateModeUI();
                renderForm();
            })
            .catch(err => alert('❌ Ошибка: ' + err.message));
    }

    function saveNewSource() {
        const title = document.getElementById('input-source-title').value.trim();
        const side = document.querySelector('input[name="source-side"]:checked').value;
        const type = document.getElementById('input-source-type').value;
        const aim = document.getElementById('input-source-aim').value.trim();
        const inst = document.getElementById('input-source-inst').value.trim();
        const video = document.getElementById('input-source-video').value.trim();
        
        if (!title) { alert('Введите название!'); return; }
        
        const target = targets[currentMap].find(t => t.id === selectedTargetId);
        if (!target) return;
        
        if (!target.sources) target.sources = [];
        
        if (editingSourceId) {
            const index = target.sources.findIndex(s => s.id === editingSourceId);
            if (index > -1) {
                target.sources[index] = { ...target.sources[index], title, side, type, aim, inst, video, x: tempCoords.x, y: tempCoords.y };
            }
        } else {
            target.sources.push({
                id: `source-${Date.now()}`,
                title, side, type, aim, inst, video,
                x: tempCoords.x,
                y: tempCoords.y
            });
        }
        
        db.ref(`lineups/${currentMap}`).set(targets[currentMap])
            .then(() => {
                removePreview();
                editingSourceId = null;
                renderAll();
                showTargetDetailsForm();
            })
            .catch(err => alert('❌ Ошибка: ' + err.message));
    }

    function editSource(sourceId) {
        const target = targets[currentMap].find(t => t.id === selectedTargetId);
        if (!target) return;
        const source = target.sources.find(s => s.id === sourceId);
        if (!source) return;
        
        editingSourceId = sourceId;
        tempCoords = { x: source.x, y: source.y };
        createPreview(source.x, source.y, 'source');
        
        const form = document.getElementById('form-content');
        form.innerHTML = `
            <h3 class="form-title">✏️ Редактировать источник</h3>
            <p style="color:var(--text-2);font-size:.85rem;margin-bottom:1rem">Для цели: <strong style="color:var(--accent)">${target.title}</strong></p>
            <div class="form-group">
                <label>Название:</label>
                <input type="text" id="input-source-title" value="${source.title}">
            </div>
            <div class="form-group">
                <label>Сторона:</label>
                <div class="side-selector">
                    <label><input type="radio" name="source-side" value="T" ${source.side === 'T' ? 'checked' : ''}> T-Side</label>
                    <label><input type="radio" name="source-side" value="CT" ${source.side === 'CT' ? 'checked' : ''}> CT-Side</label>
                </div>
            </div>
            <div class="form-group">
                <label>Тип гранаты:</label>
                <select id="input-source-type">
                    <option value="smoke" ${source.type==='smoke'?'selected':''}>💨 Smoke</option>
                    <option value="flash" ${source.type==='flash'?'selected':''}>⚡ Flash</option>
                    <option value="molotov" ${source.type==='molotov'?'selected':''}>🔥 Molotov</option>
                    <option value="he" ${source.type==='he'?'selected':''}>💥 HE</option>
                </select>
            </div>
            <div class="form-group">
                <label>Прицел:</label>
                <input type="text" id="input-source-aim" value="${source.aim || ''}">
            </div>
            <div class="form-group">
                <label>Инструкция:</label>
                <textarea id="input-source-inst">${source.inst || ''}</textarea>
            </div>
            <div class="form-group">
                <label>Видео:</label>
                <input type="text" id="input-source-video" value="${source.video || ''}">
            </div>
            <div class="form-coords">
                <div><label>X (%):</label><div class="coord-display">${source.x}%</div></div>
                <div><label>Y (%):</label><div class="coord-display">${source.y}%</div></div>
            </div>
            <p style="color:var(--text-3);font-size:.8rem;margin-bottom:.75rem">💡 Кликните на другое место карты, чтобы переместить точку</p>
            <button class="btn-admin btn-save" style="width:100%;justify-content:center" onclick="saveNewSource()">💾 Сохранить</button>
            <button class="btn-cancel" onclick="cancelEditSource()">❌ Отмена</button>
        `;
        
        document.getElementById('admin-form').scrollIntoView({ behavior: 'smooth' });
    }

    function cancelEditSource() {
        editingSourceId = null;
        removePreview();
        showTargetDetailsForm();
    }

    function deleteSource(sourceId) {
        if (!confirm('Удалить этот источник?')) return;
        const target = targets[currentMap].find(t => t.id === selectedTargetId);
        if (!target) return;
        target.sources = target.sources.filter(s => s.id !== sourceId);
        db.ref(`lineups/${currentMap}`).set(targets[currentMap])
            .then(() => {
                renderAll();
                showTargetDetailsForm();
            });
    }

    function deleteTarget(id) {
        if (!confirm('Удалить эту цель и все её источники?')) return;
        targets[currentMap] = targets[currentMap].filter(t => t.id !== id);
        selectedTargetId = null;
        mode = 'target';
        db.ref(`lineups/${currentMap}`).set(targets[currentMap])
            .then(() => {
                removePreview();
                renderAll();
                updateModeUI();
                renderForm();
            });
    }

    function clearAll() {
        if (!confirm('Удалить ВСЁ на этой карте?')) return;
        targets[currentMap] = [];
        selectedTargetId = null;
        mode = 'target';
        db.ref(`lineups/${currentMap}`).set([])
            .then(() => {
                removePreview();
                renderAll();
                updateModeUI();
                renderForm();
            });
    }

    function cancelAction() {
        removePreview();
        if (selectedTargetId) {
            showTargetDetailsForm();
        } else {
            renderForm();
        }
    }

    function renderAll() {
        const wrapper = document.getElementById('map-wrapper');
        wrapper.querySelectorAll('.admin-hotspot-target, .admin-hotspot-source, .connection-line').forEach(h => h.remove());
        
        targets[currentMap].forEach(t => {
            const div = document.createElement('div');
            div.className = 'admin-hotspot-target' + (t.id === selectedTargetId ? ' selected' : '');
            div.style.left = t.x + '%';
            div.style.top = t.y + '%';
            const count = t.sources ? t.sources.length : 0;
            div.innerHTML = `
                <div class="admin-hotspot-target-label">${t.title}</div>
                ${count > 0 ? `<div class="admin-hotspot-count">${count}</div>` : ''}
            `;
            div.onclick = (e) => { e.stopPropagation(); selectTarget(t.id); };
            wrapper.appendChild(div);
            
            if (t.id === selectedTargetId && t.sources) {
                t.sources.forEach(s => {
                    const sDiv = document.createElement('div');
                    sDiv.className = 'admin-hotspot-source';
                    sDiv.style.left = s.x + '%';
                    sDiv.style.top = s.y + '%';
                    sDiv.innerHTML = `<div class="admin-hotspot-source-label">${s.title}</div>`;
                    sDiv.onclick = (e) => { e.stopPropagation(); editSource(s.id); };
                    wrapper.appendChild(sDiv);
                    
                    drawConnection(t.x, t.y, s.x, s.y);
                });
            }
        });
        
        const items = document.getElementById('target-items');
        if (targets[currentMap].length === 0) {
            items.innerHTML = '<div class="empty-state">Нет целей. Кликните на карту, чтобы создать.</div>';
        } else {
            items.innerHTML = targets[currentMap].map(t => {
                const count = t.sources ? t.sources.length : 0;
                return `
                    <div class="target-item ${t.id === selectedTargetId ? 'selected' : ''}" onclick="selectTarget('${t.id}')">
                        <div class="target-item-info">
                            <span class="target-item-icon">🎯</span>
                            <span class="target-item-name">${t.title}</span>
                            ${count > 0 ? `<span class="target-item-count">(${count})</span>` : ''}
                        </div>
                        <div class="target-item-actions">
                            <button class="btn-sm btn-delete" onclick="event.stopPropagation();deleteTarget('${t.id}')">🗑</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        document.getElementById('target-count').textContent = targets[currentMap].length;
    }

    function drawConnection(x1, y1, x2, y2) {
        const wrapper = document.getElementById('map-wrapper');
        const line = document.createElement('div');
        line.className = 'connection-line';
        
        const dx = x2 - x1;
        const dy = y2 - y1;
        const length = Math.sqrt(dx * dx + dy * dy);
        const angle = Math.atan2(dy, dx) * 180 / Math.PI;
        
        line.style.left = x1 + '%';
        line.style.top = y1 + '%';
        line.style.width = length + '%';
        line.style.transform = `rotate(${angle}deg)`;
        
        wrapper.appendChild(line);
    }

    // Запуск при успешной авторизации
    renderAll();
    updateModeUI();
    renderForm();
}
</script>

</body>
</html>
