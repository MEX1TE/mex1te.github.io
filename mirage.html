<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mirage — Интерактивная карта | CS2NADES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f5a623'/><text x='50' y='68' font-size='55' text-anchor='middle'>💣</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="header">
    <div class="header-inner">
        <a href="index.html" class="logo"><div class="logo-icon">💣</div><div>CS2<span>NADES</span></div></a>
        <ul class="nav">
            <li><a href="index.html">Главная</a></li>
            <li><a href="index.html#maps" class="active">Карты</a></li>
            <li class="fav-counter"><a href="favorites.html">Избранное</a><span class="fav-badge"></span></li>
            <li><a href="admin.html">Админ</a></li>
        </ul>
    </div>
</header>

<section class="page-head">
    <div class="crumb"><a href="index.html">Главная</a><span class="sep">/</span><a href="index.html#maps">Карты</a><span class="sep">/</span><span style="color:var(--text-1)">Mirage</span></div>
    <h1>🕌 Mirage</h1>
    <p>Кликай на точки на карте, чтобы увидеть лайнап</p>
</section>

<section class="map-container">
    <div class="map-wrapper">
        <img src="images/mirage-radar.webp" alt="Mirage Radar" class="map-image" onerror="this.style.background='var(--bg-tertiary)';this.style.minHeight='500px'">
        <div class="map-overlay" id="map-overlay">
            <!-- Точки загружаются автоматически из Firebase -->
        </div>
        <div class="map-legend">
            <div class="legend-item"><div class="legend-dot smoke"></div><span>Smoke</span></div>
            <div class="legend-item"><div class="legend-dot flash"></div><span>Flash</span></div>
            <div class="legend-item"><div class="legend-dot molotov"></div><span>Molotov</span></div>
            <div class="legend-item"><div class="legend-dot he"></div><span>HE</span></div>
        </div>
    </div>
</section>

<section class="history-section" id="history-section">
    <div class="history-title"><h3>🕐 Недавно просмотренные</h3><button class="history-clear">Очистить</button></div>
    <div class="history-grid"></div>
</section>

<div class="map-overlay-active" id="overlay-active"></div>
<div class="lineup-panel" id="lineup-panel">
    <div class="lineup-panel-header">
        <div><h2 class="lineup-panel-title"></h2><p class="lineup-panel-subtitle"></p></div>
        <button class="lineup-panel-close" id="panel-close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="lineup-panel-content">
        <div class="lineup-panel-section"><div class="lineup-panel-section-title">🎥 Видео</div><div class="lineup-panel-video" id="panel-video"></div></div>
        <div class="lineup-panel-section"><div class="lineup-panel-section-title">📍 Позиция</div><p id="panel-pos"></p></div>
        <div class="lineup-panel-section"><div class="lineup-panel-section-title">🎯 Прицел</div><p id="panel-aim"></p></div>
        <div class="lineup-panel-section">
            <div class="lineup-panel-section-title">📝 Инструкция</div>
            <div class="inst-box">
                <button class="copy-btn" id="copy-inst"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Копировать</button>
                <p id="panel-inst"></p>
            </div>
        </div>
        <div style="display:flex;gap:.75rem;margin-top:1.5rem">
            <button class="btn btn-primary" id="fav-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> В избранное</button>
            <button class="btn btn-secondary" id="panel-close-2">Закрыть</button>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="footer-inner"><div class="footer-copy">© 2026 CS2NADES</div><ul class="footer-links"><li><a href="#">Discord</a></li><li><a href="#">Контакты</a></li></ul></div>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="script.js"></script>
<script>
    window.lineupData = {};

    db.ref('lineups/mirage').on('value', snapshot => {
        const points = snapshot.val() || [];
        const overlay = document.getElementById('map-overlay');

        overlay.innerHTML = '';
        window.lineupData = {};

        points.forEach(p => {
            const div = document.createElement('div');
            div.className = 'map-hotspot';
            div.dataset.id = p.id;
            div.style.left = p.x + '%';
            div.style.top = p.y + '%';
            div.innerHTML = `
            <div class="hotspot-label">${p.title}</div>
            ${p.lineups && p.lineups.length > 1 ? `<div style="position:absolute;top:-8px;right:-8px;background:var(--molotov);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700">${p.lineups.length}</div>` : ''}
        `;
            div.onclick = () => window.openPoint(p.id);
            overlay.appendChild(div);

            window.lineupData[p.id] = p;
        });
    });
</script>
</body>
</html>
