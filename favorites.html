<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Избранное — CS2NADES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f5a623'/><text x='50' y='68' font-size='55' text-anchor='middle'>💣</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="header">
    <div class="header-inner">
        <a href="index.html" class="logo"><div class="logo-icon">💣</div><div>CS2<span>NADES</span></div></a>
        <ul class="nav">
            <li><a href="index.html">Главная</a></li>
            <li><a href="index.html#maps">Карты</a></li>
            <li class="fav-counter"><a href="favorites.html" class="active">Избранное</a><span class="fav-badge"></span></li>
        </ul>
    </div>
</header>

<section class="favorites-page">
    <h1 class="section-title">❤️ Избранные раскидки</h1>
    <div id="favorites-container"></div>
</section>

<footer class="footer">
    <div class="footer-inner"><div class="footer-copy">© 2026 CS2NADES</div><ul class="footer-links"><li><a href="#">Discord</a></li><li><a href="#">Контакты</a></li></ul></div>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const favs = JSON.parse(localStorage.getItem('favorites') || '[]');
        const container = document.getElementById('favorites-container');
        const badge = document.querySelector('.fav-badge');
        if (badge) badge.textContent = favs.length > 0 ? favs.length : '';

        if (favs.length === 0) {
            container.innerHTML = `<div class="favorites-empty"><div class="favorites-empty-icon">💔</div><h2>Пока пусто</h2><p>Добавляй раскидки в избранное на страницах карт</p><a href="index.html#maps" class="favorites-btn">Выбрать карту</a></div>`;
        } else {
            container.innerHTML = `<div class="history-grid">${favs.map(id => `<div class="history-card" onclick="window.location.href='${id.startsWith('m')?'mirage':'dust2'}.html'"><div class="history-card-title">💣 ${id.replace(/-/g, ' ').toUpperCase()}</div><div class="history-card-meta">Нажми, чтобы открыть карту</div></div>`).join('')}</div>`;
        }
    });
</script>
</body>
</html>
