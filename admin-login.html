<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | CS2NADES Admin</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-primary);
        }
        .login-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .login-subtitle {
            color: var(--text-2);
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-input {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-1);
            font-size: 1rem;
            margin-bottom: 1rem;
            font-family: inherit;
            box-sizing: border-box;
        }
        .login-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .login-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all var(--transition);
        }
        .login-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }
        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .login-error {
            color: var(--molotov);
            font-size: 0.9rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }
        .login-error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1 class="login-title">🔒 Админ-панель</h1>
        <p class="login-subtitle">Введите email и пароль администратора</p>
        <form id="login-form">
            <input type="email" id="email-input" class="login-input" placeholder="Email" required>
            <input type="password" id="password-input" class="login-input" placeholder="Пароль" required>
            <button type="submit" class="login-btn" id="login-btn">Войти</button>
        </form>
        <div class="login-error" id="login-error"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script>
        
        const firebaseConfig = {
  apiKey: "AIzaSyAXNxDCdizaAB-3IJU65fLahDS_9ww6UWw",
  authDomain: "cs2nades-1a910.firebaseapp.com",
  databaseURL: "https://cs2nades-1a910-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "cs2nades-1a910",
  storageBucket: "cs2nades-1a910.firebasestorage.app",
  messagingSenderId: "497946011142",
  appId: "1:497946011142:web:eea3fe5839ac4d23444587",
  measurementId: "G-M14MZNH78P"
};

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Если уже авторизован — сразу в админку
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = 'admin.html';
            }
        });

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');
            
            btn.disabled = true;
            btn.textContent = 'Вход...';
            errorEl.classList.remove('show');
            
            try {
                await auth.signInWithEmailAndPassword(email, password);
                // Успешный вход — редирект произойдёт автоматически через onAuthStateChanged
            } catch (err) {
                let message = 'Ошибка входа';
                if (err.code === 'auth/wrong-password') message = 'Неверный пароль';
                else if (err.code === 'auth/user-not-found') message = 'Пользователь не найден';
                else if (err.code === 'auth/too-many-requests') message = 'Слишком много попыток. Подождите';
                
                errorEl.textContent = message;
                errorEl.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Войти';
            }
        });
    </script>
</body>
</html>
